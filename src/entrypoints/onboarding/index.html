<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hammer of Clarity — Setup</title>
    <style>
      :root {
        --bg: #fbf8f1;
        --ink: #2b2a27;
        --muted: #6f6a60;
        --gold: #c99a2e;
        --card: #ffffff;
        --line: #ece4d2;
        --picked: #fbf1d6;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1b19;
          --ink: #ece8df;
          --muted: #a49d90;
          --gold: #e3b341;
          --card: #262522;
          --line: #3a3833;
          --picked: #3a3220;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 17px/1.55 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        padding: 40px 16px;
      }
      .onboarding { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
      .emblem { width: min(260px, 70vw); align-self: center; }
      h1 { font-size: 1.7rem; font-weight: 600; margin: 0; text-align: center; }
      .lead { text-align: center; color: var(--muted); margin: 0; }
      .dots { display: flex; gap: 8px; justify-content: center; }
      .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
      .dots span.on { background: var(--gold); }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; }
      .card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card.picked { border-color: var(--gold); background: var(--picked); }
      .card-toggle {
        all: unset;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .card-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 8px; }
      .card-toggle strong { font-size: 1.1rem; }
      .card-toggle span { color: var(--muted); font-size: 0.95rem; }
      .card ul { list-style: none; padding: 0; margin: 0; columns: 2; font-size: 0.95rem; }
      .card input[type='text'], .panel input[type='text'], .panel input[type='url'], .panel select {
        font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
      }
      .card input[type='text'] { width: 100%; font-size: 0.9rem; }
      .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
      .panel ul { padding-left: 18px; }
      .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .primary {
        background: var(--gold); color: #1c1b19; border: 0; border-radius: 999px;
        padding: 10px 26px; font: inherit; font-weight: 600; cursor: pointer;
      }
      .primary:disabled { opacity: 0.45; cursor: not-allowed; }
      .quiet { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; }
      .status-ok { color: #2e7d32; font-weight: 600; }
      .status-wait { color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
