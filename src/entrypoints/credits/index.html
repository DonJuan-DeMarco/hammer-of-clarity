<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hammer of Clarity — Credits</title>
    <style>
      :root { --bg: #fbf8f1; --ink: #2b2a27; --muted: #6f6a60; --line: #ece4d2; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1c1b19; --ink: #ece8df; --muted: #a49d90; --line: #3a3833; color-scheme: dark; }
      }
      body {
        margin: 0; background: var(--bg); color: var(--ink); padding: 40px 16px;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 1.5rem; font-weight: 600; }
      h2 { font-size: 1.05rem; margin-top: 28px; }
      li { margin: 10px 0; }
      .muted { color: var(--muted); }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
