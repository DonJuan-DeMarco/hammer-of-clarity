<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hammer of Clarity</title>
    <style>
      :root {
        --bg: #fbf8f1;
        --ink: #2b2a27;
        --muted: #6f6a60;
        --gold: #c99a2e;
        --card: #ffffff;
        --line: #ece4d2;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1b19;
          --ink: #ece8df;
          --muted: #a49d90;
          --gold: #e3b341;
          --card: #262522;
          --line: #3a3833;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 17px/1.55 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      .block {
        width: 100%;
        max-width: 520px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .emblem { width: min(300px, 80vw); height: auto; }
      h1 { font-size: 1.6rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .stage { color: var(--muted); font-size: 0.95rem; }
      .stage-mark--on { color: var(--gold); }
      blockquote {
        margin: 6px 0 4px;
        padding: 0 8px;
        font-size: 1.2rem;
        font-style: italic;
        max-width: 44ch;
      }
      .instead {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 20px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .instead h2 {
        margin: 0;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .instead p { margin: 0; font-size: 1.1rem; }
      .primary {
        display: inline-block;
        background: var(--gold);
        color: #1c1b19;
        border: 0;
        border-radius: 999px;
        padding: 10px 26px;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .quiet {
        background: none;
        border: 0;
        color: var(--muted);
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
        padding: 6px;
      }
      .reset-notice {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 0.95rem;
      }
      .reset-notice p { margin: 0; }
      .primary:focus-visible, .quiet:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
