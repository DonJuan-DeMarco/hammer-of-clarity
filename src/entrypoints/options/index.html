<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Hammer of Clarity — Settings</title>
    <style>
      :root {
        --bg: #fbf8f1; --ink: #2b2a27; --muted: #6f6a60; --gold: #c99a2e; --card: #ffffff; --line: #ece4d2;
        --warn-bg: #fdecea; --warn-ink: #8a1c1c; color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1b19; --ink: #ece8df; --muted: #a49d90; --gold: #e3b341; --card: #262522; --line: #3a3833;
          --warn-bg: #3b1d1b; --warn-ink: #f2b8b5; color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      button { font: inherit; cursor: pointer; }
      .primary { background: var(--gold); color: #1c1b19; border: 0; border-radius: 999px; padding: 9px 20px; font-weight: 600; }
      .quiet { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
      button:not(.primary):not(.quiet) { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; }
      button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      input[type='text'], input[type='url'], select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
      .stage { color: var(--muted); white-space: nowrap; }
      .stage-mark--on { color: var(--gold); }
      [role='alert'] { color: var(--warn-ink); }
      .reset-notice, .graduation-notice { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
      .reset-notice p, .graduation-notice p { margin: 4px 0; }
      body { padding: 40px 16px 64px; }
      main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
      h1 { font-size: 1.8rem; font-weight: 600; margin: 0; }
      h2 { font-size: 1.15rem; margin: 0 0 6px; }
      main > section { display: flex; flex-direction: column; gap: 10px; }
      section[aria-label] > p { color: var(--muted); margin: 0; }
      article, [data-testid='removal-requests'], [data-testid='personal-blocks'], [data-testid='redirects'], [data-testid='lists'] {
        background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
      }
      article p { margin: 4px 0 8px; }
      article > p:nth-of-type(1) { color: var(--muted); }
      ul { padding-left: 18px; margin: 8px 0; }
      li { margin: 4px 0; }
      details summary { cursor: pointer; color: var(--muted); margin-top: 6px; }
      blockquote { margin: 6px 0; padding: 6px 12px; border-left: 3px solid var(--gold); font-style: italic; }
      .pending { color: var(--muted); font-style: italic; }
      form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
      footer { text-align: center; color: var(--muted); }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
