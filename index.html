<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hammer of Clarity</title>
    <meta name="description" content="Block distracting and harmful sites in one click. Unblocking takes a day and your own words." />
    <style>
      :root { --bg: #fbf8f1; --ink: #2b2a27; --muted: #6f6a60; --gold: #c99a2e; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1c1b19; --ink: #ece8df; --muted: #a49d90; --gold: #e3b341; color-scheme: dark; }
      }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); display: grid; place-items: center;
        padding: 32px 16px; box-sizing: border-box; font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 560px; text-align: center; }
      h1 { font-size: 2.2rem; margin: 0 0 8px; }
      p { color: var(--muted); }
      a { color: inherit; text-decoration-color: var(--gold); text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hammer of Clarity</h1>
      <p>Block distracting and harmful sites in one click. Unblocking takes a day and your own words, on purpose.</p>
      <p>
        <a href="privacy.html">Privacy policy</a> ·
        <a href="https://github.com/DonJuan-DeMarco/hammer-of-clarity">Source code</a>
      </p>
    </main>
  </body>
</html>
